name: Stream to ok.ru

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page URL to broadcast"
        required: true
      key:
        description: "Key name(s), comma separated, e.g. 1,1.1,1.2"
        required: true
        default: "1,1.1,1.2"
      hours:
        description: "How many hours to stream (max 5.5)"
        required: true
        default: "5"

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb pulseaudio pulseaudio-utils

      - name: Stream
        env:
          STREAM_URL: ${{ inputs.url }}
          STREAM_KEY: ${{ inputs.key }}
          HOURS: ${{ inputs.hours }}
        run: |
          timeout "${HOURS}h" python3 stream.py --url "$STREAM_URL" --key "$STREAM_KEY" || [ $? -eq 124 ]
